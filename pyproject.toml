[project]
name = "chap-gis"
version = "0.1.0"
description = "Geospatial analysis utilities for the CHAP malaria-research stack (xarray + rioxarray)."
readme = "README.md"
authors = [
    { name = "knutdrand", email = "knutdrand@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dhis2eo @ git+https://github.com/dhis2/dhis2eo.git@v1.1.0",
    "xarray>=2024.7",
    "rioxarray>=0.17",
    "rasterio>=1.3",
    "dask>=2024.7",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.33.1",
    "affine>=2.4",
    "cyclopts>=3.0",
    "dask-image>=2024.5",
    "odc-geo>=0.4",
    "pystac_client",
    "fsspec[s3]",
    "python-dotenv",
    "jupyter",
    "openeo",
    "exactextract",
]

[project.scripts]
chap-gis = "chap_gis.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: test requires network access or external credentials (opt-in via --run-integration)",
]
